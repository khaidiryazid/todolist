<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daftar Tugas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b4a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@500;700&family=Patrick+Hand&family=Shadows+Into+Light&family=Architects+Daughter&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ede1d0;
    --card: #f8f1e6;
    --stripe: #e6d5b9;
    --pill: #6b4a30;
    --pill-ink: #f8f1e6;
    --ink: #3d2b1f;
    --ink-dim: #7a6752;
    --ink-faint: #a89579;
    --accent: #6b4a30;
    --accent-wash: rgba(107,74,48,0.12);
    --line: #e2d2b6;
    --done: #b9ab93;
    --danger: #a1462f;
    --sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --hand: 'Kalam', cursive;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 18px;
    transition:background-color .25s ease, color .25s ease;
  }

  .sheet{
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:28px;
    overflow:hidden;
    box-shadow: 0 18px 40px rgba(61,43,31,0.12);
    transition:background-color .25s ease;
  }

  /* --- header --- */
  .sheet-head{ padding:26px 30px 18px; }

  .head-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }

  .badge{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--pill);
    display:flex; align-items:center; justify-content:center;
  }
  .badge span{ width:5px; height:5px; border-radius:50%; background:var(--pill-ink); margin:0 1.5px; }
  .badge .dots{ display:flex; }

  .themes{ display:flex; gap:7px; }
  .theme-dot{
    width:19px; height:19px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .theme-dot.active{ border-color:var(--ink); }

  .fonts{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .font-btn{
    background:var(--stripe);
    border:2px solid transparent;
    color:var(--ink-dim);
    font-size:14px;
    width:32px; height:28px;
    border-radius:8px;
    cursor:pointer;
  }
  .font-btn.active{ border-color:var(--pill); color:var(--ink); background:var(--card); }

  h1{
    margin:0;
    font-family:var(--hand);
    font-weight:700;
    font-size:34px;
    line-height:1;
    letter-spacing:.01em;
  }

  .date{
    display:block;
    margin-top:6px;
    font-size:13px;
    color:var(--ink-dim);
    font-weight:600;
  }

  /* torn paper accent strip */
  .torn{
    height:16px;
    background-image:
      linear-gradient(-45deg, var(--card) 8px, transparent 0),
      linear-gradient(45deg, var(--card) 8px, transparent 0);
    background-size: 16px 16px;
    background-repeat: repeat-x;
    background-position: 0 0;
    background-color: var(--bg);
  }

  /* --- projects --- */
  .projects{
    display:flex;
    align-items:center;
    gap:8px;
    padding:16px 30px 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .projects::-webkit-scrollbar{ display:none; }

  .chip{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--stripe);
    border:none;
    color:var(--ink-dim);
    font-family:var(--hand);
    font-weight:700;
    font-size:14px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--pill); color:var(--pill-ink); }
  .chip .chip-x{ margin-left:2px; opacity:.65; font-weight:400; }
  .chip .chip-x:hover{ opacity:1; }

  .chip-add{
    flex:none;
    background:none;
    border:1.5px dashed var(--ink-faint);
    color:var(--ink-dim);
    font-family:var(--hand);
    font-weight:700;
    font-size:14px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* --- composer --- */
  .composer{
    display:flex;
    gap:8px;
    padding:16px 30px 6px;
  }
  .composer input{
    flex:1;
    background:var(--stripe);
    border:none;
    outline:none;
    color:var(--ink);
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    padding:13px 18px;
    border-radius:999px;
  }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:600; }
  .composer button{
    background:var(--pill);
    color:var(--pill-ink);
    border:none;
    padding:0 22px;
    font-family:var(--hand);
    font-size:16px;
    font-weight:700;
    border-radius:999px;
    cursor:pointer;
  }

  /* --- filter pills --- */
  .filters{
    display:flex;
    gap:8px;
    padding:16px 30px 6px;
  }
  .filters button{
    flex:1;
    background:transparent;
    border:2px solid var(--stripe);
    color:var(--ink-dim);
    font-family:var(--hand);
    font-weight:700;
    font-size:14px;
    letter-spacing:.02em;
    padding:9px 0;
    border-radius:999px;
    cursor:pointer;
  }
  .filters button.active{ background:var(--pill); border-color:var(--pill); color:var(--pill-ink); }

  /* --- list section --- */
  .list-wrap{
    margin:20px 30px 6px;
    border-radius:16px;
    overflow:hidden;
  }

  ul.list{ list-style:none; margin:0; padding:0; min-height:60px; }

  li.task{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:15px 16px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  li.task:last-child{ border-bottom:none; }
  li.task:nth-child(even){ background:var(--stripe); }

  .check{
    flex:none;
    width:19px; height:19px;
    margin-top:2px;
    border:2px solid var(--ink-faint);
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .check.checked{ background:var(--pill); border-color:var(--pill); }
  .check svg{ width:11px; height:11px; opacity:0; }
  .check.checked svg{ opacity:1; }

  .task-body{ flex:1; min-width:0; }
  .task-text{ font-family:var(--hand); font-size:18px; font-weight:700; line-height:1.4; word-break:break-word; }
  li.task.done .task-text{ color:var(--done); text-decoration:line-through; }

  .task-meta{
    margin-top:4px;
    font-size:12px;
    color:var(--ink-faint);
    font-weight:600;
  }
  .task-meta .sep{ margin:0 5px; }

  .del{
    flex:none;
    background:none; border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:17px;
    line-height:1;
    padding:2px 4px;
  }
  .del:hover{ color:var(--danger); }

  .empty{
    padding:30px 16px;
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
    font-weight:700;
    background:var(--card);
  }

  /* --- footer --- */
  .sheet-foot{
    padding:16px 30px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--hand);
    font-size:15px;
    color:var(--ink-dim);
    font-weight:700;
    flex-wrap:wrap;
    gap:10px;
  }
  .foot-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .foot-btn{
    background:none; border:none;
    color:var(--ink-dim);
    cursor:pointer;
    font-family:var(--hand);
    font-weight:700;
    font-size:15px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .foot-btn:hover{ color:var(--ink); }
  .clear-done{
    background:none; border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-family:var(--hand);
    font-weight:700;
    font-size:15px;
  }
  .clear-done:hover{ color:var(--danger); }

  .music-bar{
    position:fixed;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:60;
  }
  .music-btn{
    width:46px; height:46px;
    border-radius:50%;
    border:none;
    background:var(--pill);
    color:var(--pill-ink);
    font-size:18px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
  }
  .music-next{ width:36px; height:36px; font-size:14px; opacity:.9; }
  .music-next.hidden{ display:none; }

  /* ====================================================== */
  /* THEME-SPECIFIC STRUCTURE (bukan cuma warna, tapi gaya)  */
  /* ====================================================== */

  /* ---------- 1. Minimalist ---------- */
  body[data-theme="minimalist"]{ background:var(--bg); }
  body[data-theme="minimalist"] .sheet{
    border-radius:10px; box-shadow:none; border:1px solid var(--line);
  }
  body[data-theme="minimalist"] .torn{ display:none; }
  body[data-theme="minimalist"] .head-top{ margin-bottom:22px; }
  body[data-theme="minimalist"] h1{ font-weight:800; letter-spacing:-.02em; }
  body[data-theme="minimalist"] .badge{ border-radius:4px; }
  body[data-theme="minimalist"] .chip, body[data-theme="minimalist"] .chip-add{ border-radius:4px; background:transparent; border:1px solid var(--line); }
  body[data-theme="minimalist"] .chip.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  body[data-theme="minimalist"] .composer input{ border-radius:4px; border:1px solid var(--line); }
  body[data-theme="minimalist"] .composer button{ border-radius:4px; }
  body[data-theme="minimalist"] .filters button{ border-radius:4px; border-color:var(--line); }
  body[data-theme="minimalist"] .list-wrap{ border-radius:4px; border:1px solid var(--line); }
  body[data-theme="minimalist"] li.task{ border-bottom:1px solid var(--line); }
  body[data-theme="minimalist"] li.task:nth-child(even){ background:var(--card); }
  body[data-theme="minimalist"] .check{ border-radius:4px; }
  body[data-theme="minimalist"] .theme-dot, body[data-theme="minimalist"] .font-btn{ border-radius:4px; }

  /* ---------- 2. Glassmorphism ---------- */
  body[data-theme="glass"]{
    background: linear-gradient(135deg,#8ec5fc 0%,#a78bfa 45%,#f6a6c1 100%);
    background-attachment: fixed;
  }
  body[data-theme="glass"] .sheet{
    background: rgba(255,255,255,0.18);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow: 0 8px 32px rgba(31,38,135,0.25);
  }
  body[data-theme="glass"] .torn{ display:none; }
  body[data-theme="glass"] .badge{ background:rgba(255,255,255,0.35); }
  body[data-theme="glass"] .chip, body[data-theme="glass"] .chip-add{
    background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.35); backdrop-filter: blur(6px);
  }
  body[data-theme="glass"] .chip.active{ background:rgba(255,255,255,0.5); color:var(--ink); }
  body[data-theme="glass"] .composer input{ background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.35); }
  body[data-theme="glass"] .composer button{ background:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,0.45); color:var(--ink); backdrop-filter: blur(6px); }
  body[data-theme="glass"] .filters button{ border:1px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.1); }
  body[data-theme="glass"] .filters button.active{ background:rgba(255,255,255,0.4); }
  body[data-theme="glass"] .list-wrap{ background:rgba(255,255,255,0.08); }
  body[data-theme="glass"] li.task{ background:transparent !important; border-bottom:1px solid rgba(255,255,255,0.22); }
  body[data-theme="glass"] li.task:nth-child(even){ background:rgba(255,255,255,0.1) !important; }
  body[data-theme="glass"] .empty{ background:transparent; }
  body[data-theme="glass"] .check{ background:rgba(255,255,255,0.2); }
  body[data-theme="glass"] .theme-dot.active, body[data-theme="glass"] .font-btn.active{ border-color:var(--ink); }

  /* ---------- 3. Neo-Brutalism ---------- */
  body[data-theme="brutalism"]{ background:var(--bg); }
  body[data-theme="brutalism"] .sheet{
    border:3px solid var(--line); border-radius:6px; box-shadow:9px 9px 0 var(--line);
  }
  body[data-theme="brutalism"] .torn{ display:none; }
  body[data-theme="brutalism"] h1{ font-weight:900; letter-spacing:-.01em; }
  body[data-theme="brutalism"] .badge{ border-radius:4px; border:2px solid var(--line); }
  body[data-theme="brutalism"] .chip, body[data-theme="brutalism"] .chip-add{
    border:2px solid var(--line); border-radius:5px; box-shadow:3px 3px 0 var(--line); font-weight:800;
  }
  body[data-theme="brutalism"] .chip.active{ background:var(--accent); color:#fff; }
  body[data-theme="brutalism"] .composer input{ border:2px solid var(--line); border-radius:5px; background:#fff; }
  body[data-theme="brutalism"] .composer button{ border:2px solid var(--line); border-radius:5px; box-shadow:3px 3px 0 var(--line); font-weight:900; }
  body[data-theme="brutalism"] .filters button{ border:2px solid var(--line); border-radius:5px; font-weight:900; }
  body[data-theme="brutalism"] .filters button.active{ box-shadow:3px 3px 0 var(--line); }
  body[data-theme="brutalism"] .list-wrap{ border:2px solid var(--line); border-radius:6px; }
  body[data-theme="brutalism"] li.task{ border-bottom:2px solid var(--line); }
  body[data-theme="brutalism"] .task-text{ font-weight:800; }
  body[data-theme="brutalism"] .check{ border:2px solid var(--line); border-radius:4px; }
  body[data-theme="brutalism"] .theme-dot, body[data-theme="brutalism"] .font-btn{ border-radius:4px; border:2px solid var(--line); }
  body[data-theme="brutalism"] .theme-dot.active, body[data-theme="brutalism"] .font-btn.active{ border-color:var(--accent); }

  /* ---------- 4. Dark Mode ---------- */
  body[data-theme="dark"]{ background:var(--bg); }
  body[data-theme="dark"] .sheet{
    border-radius:20px; border:1px solid var(--line); box-shadow:0 0 44px rgba(34,211,238,0.09);
  }
  body[data-theme="dark"] .torn{ display:none; }
  body[data-theme="dark"] .composer button{ box-shadow:0 0 16px rgba(34,211,238,0.35); }
  body[data-theme="dark"] .chip.active{ box-shadow:0 0 12px rgba(34,211,238,0.35); }
  body[data-theme="dark"] .filters button.active{ box-shadow:0 0 12px rgba(34,211,238,0.3); }
  body[data-theme="dark"] .check.checked{ box-shadow:0 0 10px rgba(34,211,238,0.55); }
  body[data-theme="dark"] .theme-dot.active, body[data-theme="dark"] .font-btn.active{ border-color:var(--accent); }

  /* --- mobile --- */
  @media (max-width: 600px){
    body{ padding:0; align-items:flex-start; }
    .sheet{
      border-radius:0;
      min-height:100vh;
      box-shadow:none;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .sheet-head{ padding:22px 20px 16px; padding-top:calc(22px + env(safe-area-inset-top)); }
    h1{ font-size:28px; }
    .themes{ gap:8px; }
    .theme-dot{ width:22px; height:22px; }
    .fonts{ gap:8px; }
    .font-btn{ width:36px; height:32px; font-size:15px; }
    .projects{ padding:14px 20px 4px; }
    .chip, .chip-add{ padding:9px 15px; font-size:13px; }
    .composer{ padding:14px 20px 4px; }
    .composer input{ font-size:16px; padding:13px 16px; }
    .composer button{ padding:0 18px; font-size:13px; }
    .filters{ padding:14px 20px 4px; }
    .filters button{ padding:11px 0; font-size:12px; }
    .list-wrap{ margin:16px 20px 6px; }
    li.task{ padding:13px 14px; }
    .check{ width:22px; height:22px; }
    .del{ font-size:20px; padding:4px 6px; }
    .sheet-foot{ padding:14px 20px 22px; flex-wrap:wrap; gap:8px; }
  }

  @media (max-width: 360px){
    h1{ font-size:24px; }
    .composer button{ padding:0 14px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="sheet-head">
    <div class="head-top">
      <div class="badge"><span class="dots"><span></span><span></span></span></div>
      <div class="themes" id="themes"></div>
    </div>
    <div class="fonts" id="fonts"></div>
    <h1>Daftar Tugas</h1>
    <span class="date" id="today"></span>
  </div>

  <div class="torn"></div>

  <div class="projects" id="projects"></div>

  <div class="composer">
    <input type="text" id="taskInput" placeholder="Tulis tugas baru..." autofocus>
    <button id="addBtn">Tambah</button>
  </div>

  <div class="filters">
    <button data-filter="active" class="active">BELUM SELESAI</button>
    <button data-filter="done">SELESAI</button>
  </div>

  <div class="list-wrap">
    <ul class="list" id="list"></ul>
  </div>

  <div class="sheet-foot">
    <span id="counter">0 tugas tersisa</span>
    <div class="foot-actions">
      <button class="foot-btn" id="exportBtn">Ekspor</button>
      <button class="foot-btn" id="importBtn">Impor</button>
      <button class="clear-done" id="clearDone">Hapus yang selesai</button>
    </div>
  </div>
  <input type="file" id="importInput" accept="application/json" style="display:none">
</div>

<audio id="bgAudio" loop preload="none"></audio>
<div class="music-bar">
  <button id="musicToggle" class="music-btn" aria-label="Putar/matikan musik">🔈</button>
  <button id="musicNext" class="music-btn music-next" aria-label="Lagu berikutnya">⏭</button>
</div>

<script>
  const STORAGE_KEY = 'todo-list-items-v3';
  const THEME_KEY = 'todo-list-theme-v2';

  const THEMES = {
    minimalist: {
      label:'Minimalist', swatch:'#111111',
      vars:{ '--bg':'#ffffff', '--card':'#ffffff', '--stripe':'#f6f6f6', '--pill':'#111111', '--pill-ink':'#ffffff',
        '--ink':'#111111', '--ink-dim':'#666666', '--ink-faint':'#9a9a9a', '--accent':'#111111',
        '--accent-wash':'rgba(17,17,17,0.06)', '--line':'#e6e6e6', '--done':'#c7c7c7', '--danger':'#d64545' }
    },
    glass: {
      label:'Glass', swatch:'#8ec5fc',
      vars:{ '--bg':'#a78bfa', '--card':'#ffffff', '--stripe':'#f0f0fb', '--pill':'#5b57d1', '--pill-ink':'#ffffff',
        '--ink':'#232946', '--ink-dim':'#4b5079', '--ink-faint':'#7d82ab', '--accent':'#5b57d1',
        '--accent-wash':'rgba(91,87,209,0.18)', '--line':'#d8daf0', '--done':'#a6abd6', '--danger':'#e0576b' }
    },
    brutalism: {
      label:'Brutalism', swatch:'#ff3ea5',
      vars:{ '--bg':'#fdf6e3', '--card':'#ffffff', '--stripe':'#ffe347', '--pill':'#111111', '--pill-ink':'#ffe347',
        '--ink':'#111111', '--ink-dim':'#111111', '--ink-faint':'#555555', '--accent':'#2f6fed',
        '--accent-wash':'rgba(47,111,237,0.15)', '--line':'#111111', '--done':'#9c9c9c', '--danger':'#ff3b3b' }
    },
    dark: {
      label:'Dark', swatch:'#22d3ee',
      vars:{ '--bg':'#0b0d10', '--card':'#12161b', '--stripe':'#181d23', '--pill':'#22d3ee', '--pill-ink':'#04181a',
        '--ink':'#e7f1ee', '--ink-dim':'#93a3a0', '--ink-faint':'#57635f', '--accent':'#22d3ee',
        '--accent-wash':'rgba(34,211,238,0.12)', '--line':'#242a30', '--done':'#3d4750', '--danger':'#ff5c7a' }
    }
  };

  const FONT_KEY = 'todo-list-font-v1';
  const FONTS = {
    kalam:      { label:'Kalam',      family:"'Kalam', cursive" },
    caveat:     { label:'Caveat',     family:"'Caveat', cursive" },
    patrick:    { label:'Patrick',    family:"'Patrick Hand', cursive" },
    shadows:    { label:'Shadows',    family:"'Shadows Into Light', cursive" },
    architects: { label:'Architects', family:"'Architects Daughter', cursive" }
  };

  let tasks = [];
  let projects = [];
  let activeProject = 'all';
  let filter = 'active';

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('taskInput');
  const counterEl = document.getElementById('counter');
  const todayEl = document.getElementById('today');
  const projectsEl = document.getElementById('projects');
  const themesEl = document.getElementById('themes');
  const fontsEl = document.getElementById('fonts');

  function applyFont(name){
    const font = FONTS[name] || FONTS.kalam;
    document.documentElement.style.setProperty('--hand', font.family);
    try{ localStorage.setItem(FONT_KEY, name); }catch(e){}
    renderFontSwitcher(name);
  }

  function renderFontSwitcher(activeName){
    fontsEl.innerHTML = '';
    Object.entries(FONTS).forEach(([key, font]) => {
      const b = document.createElement('button');
      b.className = 'font-btn' + (key === activeName ? ' active' : '');
      b.style.fontFamily = font.family;
      b.textContent = 'Aa';
      b.title = font.label;
      b.addEventListener('click', () => applyFont(key));
      fontsEl.appendChild(b);
    });
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if(parsed && parsed.projects && parsed.projects.length){
        projects = parsed.projects;
        tasks = parsed.tasks || [];
      } else {
        projects = [{ id:'general', name:'Umum' }];
        tasks = [];
      }
    }catch(e){
      projects = [{ id:'general', name:'Umum' }];
      tasks = [];
    }
  }

  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, tasks })); }
    catch(e){ /* penyimpanan tidak tersedia, lanjut tanpa persist */ }
  }

  function setToday(){
    const d = new Date();
    const opts = { weekday:'long', day:'numeric', month:'long', year:'numeric' };
    todayEl.textContent = d.toLocaleDateString('id-ID', opts);
  }

  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
  }

  function applyTheme(name){
    const theme = THEMES[name] || THEMES.minimalist;
    Object.entries(theme.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
    document.body.setAttribute('data-theme', THEMES[name] ? name : 'minimalist');
    try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
    renderThemeSwitcher(name);
  }

  function renderThemeSwitcher(activeName){
    themesEl.innerHTML = '';
    Object.entries(THEMES).forEach(([key, theme]) => {
      const b = document.createElement('button');
      b.className = 'theme-dot' + (key === activeName ? ' active' : '');
      b.style.background = theme.swatch;
      b.title = theme.label;
      b.addEventListener('click', () => applyTheme(key));
      themesEl.appendChild(b);
    });
  }

  function addProject(){
    const name = window.prompt('Nama proyek baru:');
    const clean = (name || '').trim();
    if(!clean) return;
    const id = clean.toLowerCase().replace(/\s+/g,'-') + '-' + Date.now().toString(36).slice(-4);
    projects.push({ id, name: clean });
    activeProject = id;
    saveData();
    renderProjects();
    render();
  }

  function deleteProject(id, e){
    e.stopPropagation();
    if(projects.length <= 1) return;
    const proj = projects.find(p => p.id === id);
    const ok = window.confirm(`Hapus proyek "${proj ? proj.name : ''}" beserta semua tugasnya?`);
    if(!ok) return;
    projects = projects.filter(p => p.id !== id);
    tasks = tasks.filter(t => t.projectId !== id);
    if(activeProject === id) activeProject = 'all';
    saveData();
    renderProjects();
    render();
  }

  function renderProjects(){
    projectsEl.innerHTML = '';

    const allChip = document.createElement('button');
    allChip.className = 'chip' + (activeProject === 'all' ? ' active' : '');
    allChip.textContent = 'Semua Proyek';
    allChip.addEventListener('click', () => { activeProject = 'all'; renderProjects(); render(); });
    projectsEl.appendChild(allChip);

    projects.forEach(p => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (activeProject === p.id ? ' active' : '');
      chip.addEventListener('click', () => { activeProject = p.id; renderProjects(); render(); });

      const label = document.createElement('span');
      label.textContent = p.name;
      chip.appendChild(label);

      if(projects.length > 1){
        const x = document.createElement('span');
        x.className = 'chip-x';
        x.textContent = '×';
        x.addEventListener('click', (e) => deleteProject(p.id, e));
        chip.appendChild(x);
      }

      projectsEl.appendChild(chip);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'chip-add';
    addBtn.textContent = '+ Proyek';
    addBtn.addEventListener('click', addProject);
    projectsEl.appendChild(addBtn);
  }

  function addTask(text){
    const clean = text.trim();
    if(!clean) return;
    const projectId = activeProject === 'all' ? projects[0].id : activeProject;
    tasks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      text: clean,
      done:false,
      projectId,
      createdAt: new Date().toISOString(),
      completedAt: null
    });
    saveData();
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t){
      t.done = !t.done;
      t.completedAt = t.done ? new Date().toISOString() : null;
      saveData();
      render();
    }
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    saveData();
    render();
  }

  function clearDone(){
    tasks = tasks.filter(t => {
      if(!t.done) return true;
      if(activeProject !== 'all' && t.projectId !== activeProject) return true;
      return false;
    });
    saveData();
    render();
  }

  function projectName(id){
    const p = projects.find(p => p.id === id);
    return p ? p.name : '';
  }

  function render(){
    listEl.innerHTML = '';

    let filtered = tasks.filter(t => filter === 'done' ? t.done : !t.done);
    if(activeProject !== 'all'){
      filtered = filtered.filter(t => t.projectId === activeProject);
    }

    if(filtered.length === 0){
      const msg = filter === 'done'
        ? 'Belum ada tugas yang selesai di sini.'
        : 'Tidak ada tugas belum selesai di sini.';
      listEl.innerHTML = `<li class="empty">${msg}</li>`;
    } else {
      filtered.forEach(t => {
        const li = document.createElement('li');
        li.className = 'task' + (t.done ? ' done' : '');

        const projectTag = activeProject === 'all' ? `${escapeHtml(projectName(t.projectId))}<span class="sep">•</span>` : '';
        const createdTag = `Dibuat ${fmtDate(t.createdAt)}`;
        const doneTag = t.done && t.completedAt ? `<span class="sep">•</span>Selesai ${fmtDate(t.completedAt)}` : '';

        li.innerHTML = `
          <span class="check ${t.done ? 'checked' : ''}" data-id="${t.id}">
            <svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="var(--pill-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="task-body">
            <span class="task-text">${escapeHtml(t.text)}</span>
            <span class="task-meta">${projectTag}${createdTag}${doneTag}</span>
          </span>
          <button class="del" data-id="${t.id}" aria-label="Hapus tugas">×</button>
        `;
        listEl.appendChild(li);
      });
    }

    const remaining = tasks.filter(t => !t.done && (activeProject === 'all' || t.projectId === activeProject)).length;
    counterEl.textContent = remaining === 1 ? '1 tugas tersisa' : `${remaining} tugas tersisa`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    addTask(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ addTask(inputEl.value); inputEl.value = ''; }
  });

  listEl.addEventListener('click', (e) => {
    const checkEl = e.target.closest('.check');
    const delEl = e.target.closest('.del');
    if(checkEl) toggleTask(checkEl.dataset.id);
    if(delEl) deleteTask(delEl.dataset.id);
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('clearDone').addEventListener('click', clearDone);

  function exportData(){
    const payload = { projects, tasks, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const stamp = new Date().toISOString().slice(0,10);
    const a = document.createElement('a');
    a.href = url;
    a.download = `daftar-tugas-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const parsed = JSON.parse(e.target.result);
        if(parsed && Array.isArray(parsed.projects) && Array.isArray(parsed.tasks)){
          const ok = window.confirm('Impor akan mengganti semua data yang ada sekarang dengan isi file backup. Lanjutkan?');
          if(!ok) return;
          projects = parsed.projects.length ? parsed.projects : [{ id:'general', name:'Umum' }];
          tasks = parsed.tasks;
          activeProject = 'all';
          saveData();
          renderProjects();
          render();
        } else {
          window.alert('File ini bukan file backup daftar tugas yang valid.');
        }
      }catch(err){
        window.alert('Gagal membaca file. Pastikan ini file backup .json yang benar.');
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('exportBtn').addEventListener('click', exportData);

  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importInput').click();
  });

  document.getElementById('importInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importData(file);
    e.target.value = '';
  });

  setToday();
  loadData();

  let savedTheme = 'minimalist';
  try{ savedTheme = localStorage.getItem(THEME_KEY) || 'minimalist'; }catch(e){}
  if(!THEMES[savedTheme]) savedTheme = 'minimalist';
  applyTheme(savedTheme);

  let savedFont = 'kalam';
  try{ savedFont = localStorage.getItem(FONT_KEY) || 'kalam'; }catch(e){}
  applyFont(savedFont);

  renderProjects();
  render();

  // === MUSIK LATAR ===
  // Tambahkan file mp3 milik Anda sendiri (yang Anda punya haknya) ke folder
  // "audio/" di repo, lalu isi daftar di bawah ini. Bisa satu lagu atau lebih —
  // kalau lebih dari satu, akan otomatis lanjut ke lagu berikutnya dan tombol
  // "lagu berikutnya" akan muncul.
  const PLAYLIST = [
    // { title: 'Tulus - Teh Hijau', src: 'audio/teh-hijau.mp3' },
    // { title: 'Lagu Lain', src: 'audio/lagu-lain.mp3' },
  ];

  let currentTrack = 0;
  let isPlaying = false;
  const audioEl = document.getElementById('bgAudio');
  const musicToggle = document.getElementById('musicToggle');
  const musicNext = document.getElementById('musicNext');

  if(PLAYLIST.length <= 1) musicNext.classList.add('hidden');

  function loadTrack(i){
    if(!PLAYLIST.length) return;
    currentTrack = (i + PLAYLIST.length) % PLAYLIST.length;
    audioEl.src = PLAYLIST[currentTrack].src;
  }

  function updateMusicIcon(){
    musicToggle.textContent = isPlaying ? '🔊' : '🔈';
    musicToggle.title = PLAYLIST.length
      ? (isPlaying ? `Sedang main: ${PLAYLIST[currentTrack].title}` : 'Putar musik')
      : 'Belum ada file musik di PLAYLIST';
  }

  function toggleMusic(){
    if(!PLAYLIST.length){
      window.alert('Belum ada file musik. Tambahkan file mp3 ke folder audio/ lalu isi PLAYLIST di kode.');
      return;
    }
    if(isPlaying){
      audioEl.pause();
      isPlaying = false;
    } else {
      if(!audioEl.src) loadTrack(currentTrack);
      audioEl.play().catch(() => { window.alert('Gagal memutar file audio. Cek path filenya.'); });
      isPlaying = true;
    }
    updateMusicIcon();
  }

  audioEl.addEventListener('ended', () => {
    loadTrack(currentTrack + 1);
    if(isPlaying) audioEl.play().catch(() => {});
    updateMusicIcon();
  });

  musicToggle.addEventListener('click', toggleMusic);
  musicNext.addEventListener('click', () => {
    if(!PLAYLIST.length) return;
    loadTrack(currentTrack + 1);
    if(isPlaying) audioEl.play().catch(() => {});
    updateMusicIcon();
  });

  updateMusicIcon();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* diabaikan jika dibuka langsung dari file lokal tanpa server */
      });
    });
  }
</script>

</body>
</html>
