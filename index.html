<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daftar Tugas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b4a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Caveat:wght@500;700&family=Patrick+Hand&family=Shadows+Into+Light&family=Architects+Daughter&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ede1d0;
    --card: #f8f1e6;
    --stripe: #e6d5b9;
    --pill: #6b4a30;
    --pill-ink: #f8f1e6;
    --ink: #3d2b1f;
    --ink-dim: #7a6752;
    --ink-faint: #a89579;
    --accent: #6b4a30;
    --accent-wash: rgba(107,74,48,0.12);
    --line: #e2d2b6;
    --done: #b9ab93;
    --danger: #a1462f;
    --sans: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --hand: 'Kalam', cursive;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:44px 18px;
    transition:background-color .25s ease, color .25s ease;
  }

  .sheet{
    width:100%;
    max-width:560px;
    background:var(--card);
    border-radius:28px;
    overflow:hidden;
    box-shadow: 0 18px 40px rgba(61,43,31,0.12);
    transition:background-color .25s ease;
  }

  /* --- header --- */
  .sheet-head{ padding:26px 30px 18px; }

  .head-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }

  .badge{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--pill);
    display:flex; align-items:center; justify-content:center;
  }
  .badge span{ width:5px; height:5px; border-radius:50%; background:var(--pill-ink); margin:0 1.5px; }
  .badge .dots{ display:flex; }

  .themes{ display:flex; gap:7px; }
  .theme-dot{
    width:19px; height:19px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .theme-dot.active{ border-color:var(--ink); }

  .fonts{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .font-btn{
    background:var(--stripe);
    border:2px solid transparent;
    color:var(--ink-dim);
    font-size:14px;
    width:32px; height:28px;
    border-radius:8px;
    cursor:pointer;
  }
  .font-btn.active{ border-color:var(--pill); color:var(--ink); background:var(--card); }

  h1{
    margin:0;
    font-family:var(--hand);
    font-weight:700;
    font-size:34px;
    line-height:1;
    letter-spacing:.01em;
  }

  .date{
    display:block;
    margin-top:6px;
    font-size:13px;
    color:var(--ink-dim);
    font-weight:600;
  }

  /* torn paper accent strip */
  .torn{
    height:16px;
    background-image:
      linear-gradient(-45deg, var(--card) 8px, transparent 0),
      linear-gradient(45deg, var(--card) 8px, transparent 0);
    background-size: 16px 16px;
    background-repeat: repeat-x;
    background-position: 0 0;
    background-color: var(--bg);
  }

  /* --- projects --- */
  .projects{
    display:flex;
    align-items:center;
    gap:8px;
    padding:16px 30px 4px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .projects::-webkit-scrollbar{ display:none; }

  .chip{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--stripe);
    border:none;
    color:var(--ink-dim);
    font-family:var(--sans);
    font-weight:700;
    font-size:12.5px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--pill); color:var(--pill-ink); }
  .chip .chip-x{ margin-left:2px; opacity:.65; font-weight:400; }
  .chip .chip-x:hover{ opacity:1; }

  .chip-add{
    flex:none;
    background:none;
    border:1.5px dashed var(--ink-faint);
    color:var(--ink-dim);
    font-family:var(--sans);
    font-weight:700;
    font-size:12.5px;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* --- composer --- */
  .composer{
    display:flex;
    gap:8px;
    padding:16px 30px 6px;
  }
  .composer input{
    flex:1;
    background:var(--stripe);
    border:none;
    outline:none;
    color:var(--ink);
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    padding:13px 18px;
    border-radius:999px;
  }
  .composer input::placeholder{ color:var(--ink-faint); font-weight:600; }
  .composer button{
    background:var(--pill);
    color:var(--pill-ink);
    border:none;
    padding:0 22px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:800;
    border-radius:999px;
    cursor:pointer;
  }

  /* --- filter pills --- */
  .filters{
    display:flex;
    gap:8px;
    padding:16px 30px 6px;
  }
  .filters button{
    flex:1;
    background:transparent;
    border:2px solid var(--stripe);
    color:var(--ink-dim);
    font-family:var(--sans);
    font-weight:800;
    font-size:12px;
    letter-spacing:.02em;
    padding:9px 0;
    border-radius:999px;
    cursor:pointer;
  }
  .filters button.active{ background:var(--pill); border-color:var(--pill); color:var(--pill-ink); }

  /* --- list section --- */
  .list-wrap{
    margin:20px 30px 6px;
    border-radius:16px;
    overflow:hidden;
  }

  ul.list{ list-style:none; margin:0; padding:0; min-height:60px; }

  li.task{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:15px 16px;
    background:var(--card);
    border-bottom:1px solid var(--line);
  }
  li.task:last-child{ border-bottom:none; }
  li.task:nth-child(even){ background:var(--stripe); }

  .check{
    flex:none;
    width:19px; height:19px;
    margin-top:2px;
    border:2px solid var(--ink-faint);
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .check.checked{ background:var(--pill); border-color:var(--pill); }
  .check svg{ width:11px; height:11px; opacity:0; }
  .check.checked svg{ opacity:1; }

  .task-body{ flex:1; min-width:0; }
  .task-text{ font-size:16px; font-weight:700; line-height:1.4; word-break:break-word; }
  li.task.done .task-text{ color:var(--done); text-decoration:line-through; }

  .task-meta{
    margin-top:4px;
    font-size:12px;
    color:var(--ink-faint);
    font-weight:600;
  }
  .task-meta .sep{ margin:0 5px; }

  .del{
    flex:none;
    background:none; border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:17px;
    line-height:1;
    padding:2px 4px;
  }
  .del:hover{ color:var(--danger); }

  .empty{
    padding:30px 16px;
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
    font-weight:700;
    background:var(--card);
  }

  /* --- footer --- */
  .sheet-foot{
    padding:16px 30px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-dim);
    font-weight:700;
  }
  .clear-done{
    background:none; border:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-weight:700;
    font-size:12px;
  }
  .clear-done:hover{ color:var(--danger); }

  /* --- mobile --- */
  @media (max-width: 600px){
    body{ padding:0; align-items:flex-start; }
    .sheet{
      border-radius:0;
      min-height:100vh;
      box-shadow:none;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .sheet-head{ padding:22px 20px 16px; padding-top:calc(22px + env(safe-area-inset-top)); }
    h1{ font-size:28px; }
    .themes{ gap:8px; }
    .theme-dot{ width:22px; height:22px; }
    .fonts{ gap:8px; }
    .font-btn{ width:36px; height:32px; font-size:15px; }
    .projects{ padding:14px 20px 4px; }
    .chip, .chip-add{ padding:9px 15px; font-size:13px; }
    .composer{ padding:14px 20px 4px; }
    .composer input{ font-size:16px; padding:13px 16px; }
    .composer button{ padding:0 18px; font-size:13px; }
    .filters{ padding:14px 20px 4px; }
    .filters button{ padding:11px 0; font-size:12px; }
    .list-wrap{ margin:16px 20px 6px; }
    li.task{ padding:13px 14px; }
    .check{ width:22px; height:22px; }
    .del{ font-size:20px; padding:4px 6px; }
    .sheet-foot{ padding:14px 20px 22px; flex-wrap:wrap; gap:8px; }
  }

  @media (max-width: 360px){
    h1{ font-size:24px; }
    .composer button{ padding:0 14px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="sheet-head">
    <div class="head-top">
      <div class="badge"><span class="dots"><span></span><span></span></span></div>
      <div class="themes" id="themes"></div>
    </div>
    <div class="fonts" id="fonts"></div>
    <h1>Daftar Tugas</h1>
    <span class="date" id="today"></span>
  </div>

  <div class="torn"></div>

  <div class="projects" id="projects"></div>

  <div class="composer">
    <input type="text" id="taskInput" placeholder="Tulis tugas baru..." autofocus>
    <button id="addBtn">Tambah</button>
  </div>

  <div class="filters">
    <button data-filter="active" class="active">BELUM SELESAI</button>
    <button data-filter="done">SELESAI</button>
  </div>

  <div class="list-wrap">
    <ul class="list" id="list"></ul>
  </div>

  <div class="sheet-foot">
    <span id="counter">0 tugas tersisa</span>
    <button class="clear-done" id="clearDone">Hapus yang selesai</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo-list-items-v3';
  const THEME_KEY = 'todo-list-theme-v2';

  const THEMES = {
    kraft: {
      label:'Kraft', swatch:'#6b4a30',
      vars:{ '--bg':'#ede1d0', '--card':'#f8f1e6', '--stripe':'#e6d5b9', '--pill':'#6b4a30', '--pill-ink':'#f8f1e6',
        '--ink':'#3d2b1f', '--ink-dim':'#7a6752', '--ink-faint':'#a89579', '--accent':'#6b4a30',
        '--accent-wash':'rgba(107,74,48,0.12)', '--line':'#e2d2b6', '--done':'#b9ab93', '--danger':'#a1462f' }
    },
    sage: {
      label:'Sage', swatch:'#4a6b3f',
      vars:{ '--bg':'#e7ede0', '--card':'#f5f8f0', '--stripe':'#dbe6cd', '--pill':'#4a6b3f', '--pill-ink':'#f5f8f0',
        '--ink':'#2b3324', '--ink-dim':'#63735a', '--ink-faint':'#96a68c', '--accent':'#4a6b3f',
        '--accent-wash':'rgba(74,107,63,0.12)', '--line':'#d3ddc5', '--done':'#a9b89e', '--danger':'#a1462f' }
    },
    blush: {
      label:'Blush', swatch:'#9c4f4a',
      vars:{ '--bg':'#f3e2df', '--card':'#fbf2f0', '--stripe':'#eecfc9', '--pill':'#9c4f4a', '--pill-ink':'#fbf2f0',
        '--ink':'#3a2422', '--ink-dim':'#7a5b58', '--ink-faint':'#b89490', '--accent':'#9c4f4a',
        '--accent-wash':'rgba(156,79,74,0.12)', '--line':'#e8cec9', '--done':'#d1aca8', '--danger':'#7a3530' }
    },
    slate: {
      label:'Slate', swatch:'#445159',
      vars:{ '--bg':'#e6e5df', '--card':'#f5f4ef', '--stripe':'#d9d7cd', '--pill':'#445159', '--pill-ink':'#f5f4ef',
        '--ink':'#2c3236', '--ink-dim':'#626b6f', '--ink-faint':'#9aa1a3', '--accent':'#445159',
        '--accent-wash':'rgba(68,81,89,0.12)', '--line':'#d3d2c7', '--done':'#b5bcbe', '--danger':'#a4523f' }
    }
  };

  const FONT_KEY = 'todo-list-font-v1';
  const FONTS = {
    kalam:      { label:'Kalam',      family:"'Kalam', cursive" },
    caveat:     { label:'Caveat',     family:"'Caveat', cursive" },
    patrick:    { label:'Patrick',    family:"'Patrick Hand', cursive" },
    shadows:    { label:'Shadows',    family:"'Shadows Into Light', cursive" },
    architects: { label:'Architects', family:"'Architects Daughter', cursive" }
  };

  let tasks = [];
  let projects = [];
  let activeProject = 'all';
  let filter = 'active';

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('taskInput');
  const counterEl = document.getElementById('counter');
  const todayEl = document.getElementById('today');
  const projectsEl = document.getElementById('projects');
  const themesEl = document.getElementById('themes');
  const fontsEl = document.getElementById('fonts');

  function applyFont(name){
    const font = FONTS[name] || FONTS.kalam;
    document.documentElement.style.setProperty('--hand', font.family);
    try{ localStorage.setItem(FONT_KEY, name); }catch(e){}
    renderFontSwitcher(name);
  }

  function renderFontSwitcher(activeName){
    fontsEl.innerHTML = '';
    Object.entries(FONTS).forEach(([key, font]) => {
      const b = document.createElement('button');
      b.className = 'font-btn' + (key === activeName ? ' active' : '');
      b.style.fontFamily = font.family;
      b.textContent = 'Aa';
      b.title = font.label;
      b.addEventListener('click', () => applyFont(key));
      fontsEl.appendChild(b);
    });
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      if(parsed && parsed.projects && parsed.projects.length){
        projects = parsed.projects;
        tasks = parsed.tasks || [];
      } else {
        projects = [{ id:'general', name:'Umum' }];
        tasks = [];
      }
    }catch(e){
      projects = [{ id:'general', name:'Umum' }];
      tasks = [];
    }
  }

  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, tasks })); }
    catch(e){ /* penyimpanan tidak tersedia, lanjut tanpa persist */ }
  }

  function setToday(){
    const d = new Date();
    const opts = { weekday:'long', day:'numeric', month:'long', year:'numeric' };
    todayEl.textContent = d.toLocaleDateString('id-ID', opts);
  }

  function fmtDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
  }

  function applyTheme(name){
    const theme = THEMES[name] || THEMES.kraft;
    Object.entries(theme.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
    try{ localStorage.setItem(THEME_KEY, name); }catch(e){}
    renderThemeSwitcher(name);
  }

  function renderThemeSwitcher(activeName){
    themesEl.innerHTML = '';
    Object.entries(THEMES).forEach(([key, theme]) => {
      const b = document.createElement('button');
      b.className = 'theme-dot' + (key === activeName ? ' active' : '');
      b.style.background = theme.swatch;
      b.title = theme.label;
      b.addEventListener('click', () => applyTheme(key));
      themesEl.appendChild(b);
    });
  }

  function addProject(){
    const name = window.prompt('Nama proyek baru:');
    const clean = (name || '').trim();
    if(!clean) return;
    const id = clean.toLowerCase().replace(/\s+/g,'-') + '-' + Date.now().toString(36).slice(-4);
    projects.push({ id, name: clean });
    activeProject = id;
    saveData();
    renderProjects();
    render();
  }

  function deleteProject(id, e){
    e.stopPropagation();
    if(projects.length <= 1) return;
    const proj = projects.find(p => p.id === id);
    const ok = window.confirm(`Hapus proyek "${proj ? proj.name : ''}" beserta semua tugasnya?`);
    if(!ok) return;
    projects = projects.filter(p => p.id !== id);
    tasks = tasks.filter(t => t.projectId !== id);
    if(activeProject === id) activeProject = 'all';
    saveData();
    renderProjects();
    render();
  }

  function renderProjects(){
    projectsEl.innerHTML = '';

    const allChip = document.createElement('button');
    allChip.className = 'chip' + (activeProject === 'all' ? ' active' : '');
    allChip.textContent = 'Semua Proyek';
    allChip.addEventListener('click', () => { activeProject = 'all'; renderProjects(); render(); });
    projectsEl.appendChild(allChip);

    projects.forEach(p => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (activeProject === p.id ? ' active' : '');
      chip.addEventListener('click', () => { activeProject = p.id; renderProjects(); render(); });

      const label = document.createElement('span');
      label.textContent = p.name;
      chip.appendChild(label);

      if(projects.length > 1){
        const x = document.createElement('span');
        x.className = 'chip-x';
        x.textContent = '×';
        x.addEventListener('click', (e) => deleteProject(p.id, e));
        chip.appendChild(x);
      }

      projectsEl.appendChild(chip);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'chip-add';
    addBtn.textContent = '+ Proyek';
    addBtn.addEventListener('click', addProject);
    projectsEl.appendChild(addBtn);
  }

  function addTask(text){
    const clean = text.trim();
    if(!clean) return;
    const projectId = activeProject === 'all' ? projects[0].id : activeProject;
    tasks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      text: clean,
      done:false,
      projectId,
      createdAt: new Date().toISOString(),
      completedAt: null
    });
    saveData();
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t){
      t.done = !t.done;
      t.completedAt = t.done ? new Date().toISOString() : null;
      saveData();
      render();
    }
  }

  function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    saveData();
    render();
  }

  function clearDone(){
    tasks = tasks.filter(t => {
      if(!t.done) return true;
      if(activeProject !== 'all' && t.projectId !== activeProject) return true;
      return false;
    });
    saveData();
    render();
  }

  function projectName(id){
    const p = projects.find(p => p.id === id);
    return p ? p.name : '';
  }

  function render(){
    listEl.innerHTML = '';

    let filtered = tasks.filter(t => filter === 'done' ? t.done : !t.done);
    if(activeProject !== 'all'){
      filtered = filtered.filter(t => t.projectId === activeProject);
    }

    if(filtered.length === 0){
      const msg = filter === 'done'
        ? 'Belum ada tugas yang selesai di sini.'
        : 'Tidak ada tugas belum selesai di sini.';
      listEl.innerHTML = `<li class="empty">${msg}</li>`;
    } else {
      filtered.forEach(t => {
        const li = document.createElement('li');
        li.className = 'task' + (t.done ? ' done' : '');

        const projectTag = activeProject === 'all' ? `${escapeHtml(projectName(t.projectId))}<span class="sep">•</span>` : '';
        const createdTag = `Dibuat ${fmtDate(t.createdAt)}`;
        const doneTag = t.done && t.completedAt ? `<span class="sep">•</span>Selesai ${fmtDate(t.completedAt)}` : '';

        li.innerHTML = `
          <span class="check ${t.done ? 'checked' : ''}" data-id="${t.id}">
            <svg viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1.5" stroke="var(--pill-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="task-body">
            <span class="task-text">${escapeHtml(t.text)}</span>
            <span class="task-meta">${projectTag}${createdTag}${doneTag}</span>
          </span>
          <button class="del" data-id="${t.id}" aria-label="Hapus tugas">×</button>
        `;
        listEl.appendChild(li);
      });
    }

    const remaining = tasks.filter(t => !t.done && (activeProject === 'all' || t.projectId === activeProject)).length;
    counterEl.textContent = remaining === 1 ? '1 tugas tersisa' : `${remaining} tugas tersisa`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    addTask(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ addTask(inputEl.value); inputEl.value = ''; }
  });

  listEl.addEventListener('click', (e) => {
    const checkEl = e.target.closest('.check');
    const delEl = e.target.closest('.del');
    if(checkEl) toggleTask(checkEl.dataset.id);
    if(delEl) deleteTask(delEl.dataset.id);
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('clearDone').addEventListener('click', clearDone);

  setToday();
  loadData();

  let savedTheme = 'kraft';
  try{ savedTheme = localStorage.getItem(THEME_KEY) || 'kraft'; }catch(e){}
  applyTheme(savedTheme);

  let savedFont = 'kalam';
  try{ savedFont = localStorage.getItem(FONT_KEY) || 'kalam'; }catch(e){}
  applyFont(savedFont);

  renderProjects();
  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        /* diabaikan jika dibuka langsung dari file lokal tanpa server */
      });
    });
  }
</script>

</body>
</html>
